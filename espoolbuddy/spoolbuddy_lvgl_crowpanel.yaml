                    # ---- Right column text layout (x=104) ----
                    #  y: 18  [Brand ── 324 px ─────────────────────────────── ]
                    #  y: 54  [Material type + subtype ── 324 px ──────────────]
                    #  y: 105  [swatch][hex]               | [temp range        ]
                    #  y: 138  (left col: icon ends y=92)  | [AMS name roboto_16]
                    #  y: 165                                  [Slot X   roboto_12]
                    #  y: 189  [weight cur roboto_16]         [weight tot right  ]
                    #  y: 222  [═══════ weight bar 324 px ═══════════════════════]
