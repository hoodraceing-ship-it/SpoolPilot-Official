                    - obj:   {id: modal_color_swatch,  x: 173, y: 105,  width: 87,  height: 30, bg_color: 0x555577, bg_opa: COVER, border_color: 0x8888AA, border_width: 1, radius: 3, scrollbar_mode: "OFF"}
