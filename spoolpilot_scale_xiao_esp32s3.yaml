################################################################################
# SpoolPilot Scale — ESPHome Configuration
# Target: Seeed Studio XIAO ESP32-S3 (HX711-only diagnostic build)
#
# Architecture:
#   • scale_mode: true  — this device does NOT connect to BamBuddy at all.
#     It exposes a tiny HTTP server (port 80) for tare/calibrate commands:
#       POST /tare     → apply tare, persist to NVS
#       POST /calibrate → body: {"reference_weight_grams": N}
#   • Weight readings are PUSHED to the console (port 8080) instead of being
#     polled.  The console relays them to BamBuddy under its own device_id.
#   • Tare / calibrate commands are delivered in the /scale/heartbeat
#     response; the scale performs them locally and pushes the result back.
#   • Tare offset and calibration factor are stored in NVS (namespace "spoolbuddy")
#     so they survive reboots with no server dependency.
#
# Hardware connections:
#   Scale:  HX711 (DOUT/DT=D7/GPIO44, CLK/SCK=D8/GPIO7)
#   NFC:    Disabled while scale reliability is tested. Do not connect a PN532
#           to D7 or D8 because those pins are dedicated to the HX711.
################################################################################

esphome:
  name: spoolpilot-scale
  friendly_name: SpoolPilot Scale
  project:
    name: spoolpilot.scale
    version: "0.1.8"
  on_boot:
    priority: 600
    then:
      - logger.log: "SpoolPilot Scale booting (scale_mode)..."

esp32:
  board: seeed_xiao_esp32s3
  variant: ESP32S3
  framework:
    type: esp-idf
    version: recommended
    sdkconfig_options:
      # Extend the task watchdog — HTTP server callbacks can take a few hundred ms.
      CONFIG_ESP_TASK_WDT_TIMEOUT_S: "30"

external_components:
  - source:
      type: local
      path: components
    components: [bambuddy_api]

logger:
  level: INFO
  baud_rate: 115200

wifi:
  id: wifi_comp
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  power_save_mode: none
  reboot_timeout: 5min
  # Allow a fresh scan on reconnect so mesh/multi-AP networks select the
  # strongest access point instead of reusing a weak cached BSSID.
  fast_connect: false
  output_power: 20.5dB
  ap:
    ssid: "SpoolPilot Scale Fallback"
    password: !secret fallback_hotspot_password
  on_connect:
    - logger.log: "WiFi connected"
    - lambda: bambuddy->restart_scale_server();
  on_disconnect:
    - logger.log: "WiFi disconnected"

captive_portal:

ota:
  - platform: esphome
    password: !secret ota_password

# Optional: Home Assistant native API (exposes the sensor entity)
api:
  encryption:
    key: !secret api_encryption_key
  reboot_timeout: 0s   # scale runs standalone; never reboot just because HA isn't there

# ============================================================================
# BambuddyAPI — scale server mode
# No backend_url / api_key required; starts HTTP server on port 80 instead.
# ============================================================================
bambuddy_api:
  id: bambuddy
  # No backend_url / api_key — this device never contacts BamBuddy directly
  hostname: "SpoolPilot-Scale"
  scale_mode: true    # starts HTTP server for tare/cal; persists cal in NVS
  scale_report_interval: 100 # ms — weight push cadence to the console
  # Push weight events to the console instead of waiting to be polled.
  # Set this to the console's reserved LAN address. Patrick's current console
  # address is used here so the scale does not depend on unreliable mDNS.
  console_url: "http://192.168.1.168"

# ============================================================================
# Buttons
# ============================================================================
button:
  - platform: template
    name: "Tare Scale"
    id: tare_button
    # local_tare() reads the current ADC reading as the new zero-point and saves
    # it to NVS immediately.  No network call needed.
    on_press:
      then:
        - lambda: bambuddy->local_tare();

  - platform: restart
    name: "Restart"
    id: restart_button

# ============================================================================
# Stability-detector state (see the HX711 on_value lambda + 250 ms interval)
# ============================================================================
globals:
  - id: scale_last_change_ms   # millis() of the last >=1 g change (0 = none yet)
    type: uint32_t
    restore_value: no
    initial_value: '0'
  - id: scale_last_grams       # most recent emitted weight, re-pushed when stable
    type: float
    restore_value: no
    initial_value: '0.0f'
  - id: scale_is_stable        # latched true once the reading has been frozen long enough
    type: bool
    restore_value: no
    initial_value: 'false'
  - id: scale_last_stable_push_ms  # repeat stable state so a busy HTTP queue cannot lose it
    type: uint32_t
    restore_value: no
    initial_value: '0'

# ============================================================================
# HX711 scale sensor — weight in grams
# ============================================================================
sensor:
  - platform: hx711
    name: "Spool Weight"
    id: spool_weight
    dout_pin: GPIO44     # XIAO D7 — HX711 DT/DOUT
    clk_pin: GPIO7       # XIAO D8 — HX711 SCK/CLK
    gain: 128
    update_interval: 200ms   # 10 SPS = 100 ms/conv; 200 ms gives 100 ms margin
                              # so scheduler jitter (including WiFi TX) never races the ADC
    unit_of_measurement: "g"
    accuracy_decimals: 1
    filters:
      # 1. Median(7): reject cable/HX711 spikes before averaging.
      - median:
          window_size: 7
          send_every: 1
      # 2. SMA(15): smooth over three seconds and emit at most every 600 ms.
      - sliding_window_moving_average:
          window_size: 15
          send_every: 3
      # 3. Load-cell polarity: ADC goes negative when weight is added.
      #    Negate so the rest of the pipeline always operates on positive values.
      #    If readings still go negative under load, remove this filter instead.
      - multiply: -1
      # 4. Coarse ADC → grams mapping (placeholder).
      #    Real zero-point (tare_f) and slope (cal_factor) are stored in NVS and
      #    applied at HTTP-serve time; this just needs to be a consistent linear map.
      - calibrate_linear:
          - 0 -> 0
          - 1000000 -> 1000
      # 5. Suppress sub-1 g motion. The UI displays whole grams, so smaller
      #    changes only create false movement and unnecessary network redraws.
      - delta: 1.0
    on_value:
      then:
        - lambda: |-
            // A new emission means the filtered reading just moved by >=1 g —
            // the delta filter above blocks anything smaller — so the scale
            // is NOT settled.  We cannot detect "stable" here: once the value
            // holds steady the delta filter stops emitting, so settled == the
            // absence of on_value calls.  Record the change time and report
            // unstable now; the 250 ms interval below latches stable once the
            // reading has been frozen long enough and pushes the final value.
            float grams = x;
            id(scale_last_grams)     = grams;
            id(scale_last_change_ms) = millis();
            id(scale_is_stable)      = false;
            // on_scale_reading() updates display_state_ (weight/stable).
            // In scale_mode the SCALE_READING job enqueue is skipped
            // automatically, so no BamBuddy traffic is generated here.
            bambuddy->on_scale_reading(grams, false, 0);

  - platform: wifi_signal
    name: "WiFi Signal"
    id: wifi_signal_sensor
    update_interval: 10s

  - platform: uptime
    name: "Uptime"
    id: uptime_sensor
    update_interval: 10s

# ============================================================================
# XIAO on-board user LED — GPIO21, active low
#   On  = WiFi up + console heartbeat OK
#   Off = WiFi or console unavailable
# ============================================================================
output:
  - platform: gpio
    id: status_led_output
    pin:
      number: GPIO21
      inverted: true

light:
  - platform: binary
    id: status_led
    name: "Status LED"
    output: status_led_output
    internal: true
    restore_mode: ALWAYS_OFF

interval:
# Stability detector.  The HX711 pipeline's delta(1.0) filter stops emitting
  # on_value once the reading is steady, so "stable" cannot be edge-detected
  # from the sensor stream — it must be timed.  When the last >=0.3 g change was
  # >= 3 seconds ago, declare the weight stable
  # and push it once: the value is frozen, so no on_value will do it for us.
  # Three seconds prevents tare/calibration while the median + moving-average
  # pipeline is still converging after boot or a physical disturbance.
  - interval: 250ms
    then:
      - lambda: |-
          const uint32_t now = millis();
          if (!id(scale_is_stable) && id(scale_last_change_ms) != 0 &&
              (now - id(scale_last_change_ms)) >= 3000) {
            id(scale_is_stable) = true;
            id(scale_last_stable_push_ms) = 0;
          }

          // A scale weight job may already be queued at the instant stability
          // changes. In that case on_scale_reading() intentionally coalesces
          // the new job, which used to lose the only stable=true notification
          // and left the console's Tare button disabled forever. Re-publish the
          // settled value once per second while stable; the pending-job guard
          // still prevents queue growth.
          if (id(scale_is_stable) &&
              (id(scale_last_stable_push_ms) == 0 ||
               (now - id(scale_last_stable_push_ms)) >= 1000)) {
            id(scale_last_stable_push_ms) = now;
            bambuddy->on_scale_reading(id(scale_last_grams), true, 0);
          }

  - interval: 1s
    then:
      - lambda: |-
          bool wifi_ok    = id(wifi_comp).is_connected();
          bool console_ok = bambuddy->is_console_connected(5000);

          // Determine state (0=no WiFi, 1=WiFi only, 2=fully connected).
          int state = !wifi_ok ? 0 : (!console_ok ? 1 : 2);

          // Log on state transitions only
          static int prev_state = -1;
          if (state != prev_state) {
            prev_state = state;
            if (state == 0)
              ESP_LOGI("status_led", "No WiFi — LED off");
            else if (state == 1)
              ESP_LOGI("status_led", "WiFi up, console absent — LED off");
            else
              ESP_LOGI("status_led", "WiFi up, console connected — LED on");
          }

          if (state == 2)
            id(status_led).turn_on().perform();
          else
            id(status_led).turn_off().perform();
