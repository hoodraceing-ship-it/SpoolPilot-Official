name: Build SpoolPilot Tag Writer

permissions:
  contents: write

on:
  workflow_dispatch:
  push:
    paths:
      - "tag_writer/**"
      - ".github/workflows/build-spoolpilot-tag-writer.yml"

jobs:
  test-and-build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install build dependencies
        run: py -m pip install pyinstaller py7zr
      - name: Run source tests
        shell: pwsh
        run: |
          py -m tag_writer.test_tag_writer
          py -c "from tag_writer import client_support; assert client_support.missing_client_items('.')"
          py -c "from pathlib import Path; s=Path('tag_writer/SpoolPilotTagWriter_v049.pyw').read_text(); assert '0.4.9' in s; assert 'hf mf restore --force' in s; assert '_write_uid_with_forced_restore' in s; assert '_verify_uid_after_restore' in s"
      - name: Build portable EXE
        shell: pwsh
        run: >-
          py -m PyInstaller
          --noconfirm
          --clean
          --onefile
          --windowed
          --collect-all py7zr
          --hidden-import py7zr
          --hidden-import tkinter
          --hidden-import tkinter.ttk
          --hidden-import tkinter.filedialog
          --hidden-import tkinter.messagebox
          --add-data "tag_writer/SpoolPilotTagWriter.pyw;."
          --add-data "tag_writer/SpoolPilotTagWriter_v047.pyw;."
          --add-data "tag_writer/SpoolPilotTagWriter_v048.pyw;."
          --add-data "tag_writer/client_support.py;."
          --name SpoolPilot-Tag-Writer
          tag_writer/SpoolPilotTagWriter_v049.pyw
      - name: Smoke test packaged EXE
        shell: pwsh
        run: |
          $env:PYINSTALLER_RESET_ENVIRONMENT = '1'
          $process = Start-Process -FilePath 'dist/SpoolPilot-Tag-Writer.exe' -ArgumentList '--self-test' -Wait -PassThru
          if ($process.ExitCode -ne 0) {
            throw "Packaged SpoolPilot self-test failed with exit code $($process.ExitCode)"
          }
      - name: Create SHA-256 file
        shell: pwsh
        run: |
          $hash = (Get-FileHash 'dist/SpoolPilot-Tag-Writer.exe' -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash  SpoolPilot-Tag-Writer.exe" | Set-Content 'dist/SpoolPilot-Tag-Writer.exe.sha256' -Encoding ascii
      - uses: actions/upload-artifact@v4
        with:
          name: SpoolPilot-Tag-Writer-Windows
          path: |
            dist/SpoolPilot-Tag-Writer.exe
            dist/SpoolPilot-Tag-Writer.exe.sha256
          if-no-files-found: error
      - name: Publish Windows app release
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = 'tag-writer-v0.4.9'
          gh release view $tag *> $null
          if ($LASTEXITCODE -ne 0) {
            gh release create $tag --title 'SpoolPilot Tag Writer 0.4.9' --notes 'Uses the Proxmark3 forced restore path required by write-once S50 FUID tags for permanent UID programming. All reversible data and sectors 1-15 are still verified first, then the UID and manufacturer block are confirmed with targeted retries.'
          }
          gh release upload $tag 'dist/SpoolPilot-Tag-Writer.exe' 'dist/SpoolPilot-Tag-Writer.exe.sha256' --clobber
