                    - label: {id: modal_temps,         x: 453, y: 105,  width: 260, height: 30, text: "", text_font: roboto_16, text_color: 0xDDDDEE,  align: TOP_LEFT}
                    - label: {id: modal_slotinfo,      x: 453, y: 138,  width: 260, height: 27, text: "", text_font: roboto_16, text_color: 0x18E6DF,  long_mode: DOT, align: TOP_LEFT}
                    - label: {id: modal_slotnum,       x: 453, y: 165, width: 260, height: 21, text: "", text_font: roboto_12, text_color: 0x5566BB,  align: TOP_LEFT}
