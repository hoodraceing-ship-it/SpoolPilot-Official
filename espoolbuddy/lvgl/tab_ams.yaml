    # ---- AMS pagination nav bar (y=220, h=26) ----------------
    - button:
        id: ams_pg_prev
        x: 7
        y: 330
        width: 113
        height: 39
        styles: sty_accent_btn
        scrollbar_mode: "OFF"
        hidden: true
        on_click:
          then:
            - lambda: "if (id(ams_page) > 0) id(ams_page)--;"
        widgets:
          - label: {x: 0, y: 0, width: 113, height: 39, text: "\U000F0141", text_font: mdi_24, text_color: 0x7BB4FF, align: CENTER}
    - label:
        id: ams_pg_label
        x: 0
        y: 330
        width: 800
        height: 39
        text: ""
        text_font: roboto_12
        text_color: 0xCCCCDD
        text_align: CENTER
        align: TOP_LEFT
        hidden: true
    - button:
        id: ams_pg_next
        x: 680
        y: 330
        width: 113
        height: 39
        styles: sty_accent_btn
        scrollbar_mode: "OFF"
        hidden: true
        on_click:
          then:
            - lambda: "id(ams_page)++;"
        widgets:
          - label: {x: 0, y: 0, width: 113, height: 39, text: "\U000F0142", text_font: mdi_24, text_color: 0x7BB4FF, align: CENTER}
