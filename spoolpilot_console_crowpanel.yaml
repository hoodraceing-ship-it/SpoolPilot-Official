################################################################################
# SpoolPilot Console — CrowPanel Advance 5" ESP32-S3
#
# Hardware:
#   Board: ESP32-S3-WROOM-1-N16R8
#          16 MB flash / 8 MB octal PSRAM
#
#   Display: ST7262 800x480 RGB
#
#   Touch: GT911
#          SDA = GPIO15
#          SCL = GPIO16
#
#   NFC PN532 via SPI:
#          SCK  = GPIO5
#          MOSI = GPIO6
#          MISO = GPIO4
#          SS   = GPIO19
#
#   CrowPanel controller:
#          I2C address 0x30
#
################################################################################

esphome:
  name: spoolpilot-console
  friendly_name: SpoolPilot Console

  project:
    name: spoolpilot.console
    version: "0.1.0"

  on_boot:

    # Keep CPU/APB stable before display initialization
    - priority: 600
      then:
        - logger.log: "SpoolPilot CrowPanel booting..."
        - lambda: bambuddy->configure_pm(false);

    # Turn CrowPanel backlight on after boot
    - priority: -100
      then:
        - lambda: |-
            uint8_t brightness = 0;
            id(crowpanel_controller).write(&brightness, 1);
            ESP_LOGI("backlight", "CrowPanel backlight initialized");

        # Restore the SpoolPilot tab state
        - script.execute: apply_tab


################################################################################
# ESP32-S3
################################################################################

esp32:
  board: esp32-s3-devkitc-1
  variant: ESP32S3
  flash_size: 16MB

  framework:
    type: esp-idf
    version: recommended

    sdkconfig_options:

      CONFIG_ESP32S3_DEFAULT_CPU_FREQ_240: "y"

      CONFIG_ESP32S3_DATA_CACHE_64KB: "y"
      CONFIG_ESP32S3_DATA_CACHE_LINE_64B: "y"

      CONFIG_ESP_TASK_WDT_TIMEOUT_S: "30"

      CONFIG_MBEDTLS_CERTIFICATE_BUNDLE: "y"

      CONFIG_PM_ENABLE: "y"

      CONFIG_FREERTOS_USE_TICKLESS_IDLE: "1"


################################################################################
# PSRAM
################################################################################

psram:
  mode: octal
  speed: 80MHz


################################################################################
# SpoolPilot custom components
################################################################################

external_components:

  - source:
      # Use the customized components stored beside this YAML. They contain
      # the matching AMS drying, barcode, NFC, and CrowPanel additions used by
      # the matching SpoolPilot UI files below.
      type: local
      path: components

    components:
      - bambuddy_api
      - bambuddy_nfc


################################################################################
# Logging
################################################################################

logger:

  level: DEBUG

  baud_rate: 115200

  logs:

    scheduler: INFO
    component: INFO
    sensor: INFO
    light: INFO
    lvgl: INFO
    touchscreen: INFO
    wifi: INFO
    api: INFO
    ota: INFO
    mdns: INFO

    esp-tls: DEBUG
    transport_base: DEBUG
    HTTP_CLIENT: DEBUG
    bambuddy_api: DEBUG

################################################################################
# Wi-Fi
################################################################################

wifi:

  ssid: !secret wifi_ssid
  password: !secret wifi_password

  ap:
    ssid: "SpoolPilot Fallback"
    password: !secret fallback_hotspot_password

  power_save_mode: none

  # CrowPanel reliability: reconnect quickly and use the ESP32-S3's maximum
  # supported Wi-Fi transmit power. The panel is installed near printers and
  # other metalwork, so link margin matters.
  fast_connect: true
  output_power: 20.5dB

  on_connect:
    - logger.log: "WiFi connected"

  on_disconnect:
    - logger.log: "WiFi disconnected"


captive_portal:


################################################################################
# OTA
################################################################################

ota:

  - platform: esphome
    password: !secret ota_password


################################################################################
# ESPHome API
################################################################################

api:

  encryption:
    key: !secret api_encryption_key

  reboot_timeout: 0s


################################################################################
# Time
################################################################################

time:

  - platform: sntp
    id: sntp_time

    # We'll change this later to your local timezone.
    timezone: America/New_York


################################################################################
# I2C
#
# GT911 touchscreen
# CrowPanel STC controller
################################################################################

i2c:

  - id: i2c_bus

    sda: GPIO15
    scl: GPIO16

    frequency: 400kHz

    scan: true


################################################################################
# CrowPanel onboard controller
#
# Controls backlight and other onboard functions.
################################################################################

i2c_device:

  - id: crowpanel_controller

    i2c_id: i2c_bus

    address: 0x30


################################################################################
# PN532 SPI
################################################################################

spi:

  - id: nfc_spi

    clk_pin: GPIO5

    mosi_pin: GPIO6

    miso_pin: GPIO4


################################################################################
# Sensors
################################################################################

sensor:

  - platform: wifi_signal

    name: "WiFi Signal"

    id: wifi_signal_sensor

    update_interval: 10s


  - platform: uptime

    name: "Uptime"

    id: uptime_sensor

    update_interval: 300s


################################################################################
# Buttons
################################################################################

button:

  - platform: template

    name: "Tare Scale"

    id: tare_button

    on_press:

      then:

        - lambda: bambuddy->request_tare();


  - platform: restart

    name: "Restart"

    id: restart_button


################################################################################
# CrowPanel Backlight
#
# SpoolPilot expects an entity named:
#
#     display_backlight
#
# The WT32 used normal PWM.
#
# Our CrowPanel uses the STC8H1K28 controller at I2C 0x30 instead.
#
# On the V1.2-style CrowPanel controller:
#
#     0   = maximum brightness
#     244 = minimum brightness
#     245 = off
#
################################################################################

output:

  - platform: template

    id: crowpanel_backlight_output

    type: float

    write_action:

      - lambda: |-

          float level = state;

          uint8_t value;

          if (level <= 0.001f) {

            value = 245;

          } else {

            /*
             * ESPHome:
             *
             * level 1.0 = maximum brightness
             * level 0.0 = off
             *
             * CrowPanel:
             *
             * value 0   = maximum brightness
             * value 244 = minimum brightness
             */

            value = (uint8_t) roundf((1.0f - level) * 244.0f);

          }

          id(crowpanel_controller).write(&value, 1);


light:

  - platform: monochromatic

    output: crowpanel_backlight_output

    name: "Display Backlight"

    id: display_backlight

    restore_mode: ALWAYS_ON

    default_transition_length: 0ms


################################################################################
# 5" 800x480 CrowPanel RGB Display
################################################################################

display:

  - platform: mipi_rgb

    model: RPI

    id: main_display


    dimensions:

      width: 800

      height: 480


    color_order: RGB

    invert_colors: false


    pclk_frequency: 16MHz

    pclk_inverted: true


    de_pin: GPIO42

    hsync_pin: GPIO40

    vsync_pin: GPIO41

    pclk_pin: GPIO39


    hsync_front_porch: 8

    hsync_pulse_width: 4

    hsync_back_porch: 8


    vsync_front_porch: 8

    vsync_pulse_width: 4

    vsync_back_porch: 8


    data_pins:

      red:

        - GPIO7
        - GPIO17
        - GPIO18
        - GPIO3
        - GPIO46


      green:

        - GPIO9
        - GPIO10
        - GPIO11
        - GPIO12
        - GPIO13
        - GPIO14


      blue:

        - GPIO21
        - GPIO47
        - GPIO48
        - GPIO45
        - GPIO38


    auto_clear_enabled: false

    update_interval: never


################################################################################
# GT911 Touchscreen
################################################################################

touchscreen:

  - platform: gt911

    id: touch_screen

    i2c_id: i2c_bus

    display: main_display

    update_interval: 16ms


    on_touch:

      - lambda: |-

          id(display_backlight)
            ->turn_on()
            .set_brightness(
              id(backlight_brightness_pct) / 100.0f
            )
            .set_transition_length(0)
            .perform();


################################################################################
# Bambuddy API
################################################################################

bambuddy_api:

  id: bambuddy

  backend_url: !secret bambuddy_backend_url

  api_key: !secret bambuddy_api_key

  hostname: "SpoolPilot-Console"

  inventory_backend: internal

  heartbeat_interval: 10

  scale_report_interval: 250

  printer_poll_interval: 30

  sleep_factor: 6

  clock_24h: true


################################################################################
# CrowPanel SpoolPilot packages
################################################################################

packages:

  app:
    !include espoolbuddy/spoolbuddy_app_crowpanel.yaml

  assets:
    !include espoolbuddy/spoolbuddy_assets.yaml

  ui:
    !include espoolbuddy/spoolbuddy_lvgl_crowpanel.yaml
