obj:
  id: content_ams
  x: 0
  y: 45
  width: 800
  height: 375
  styles: sty_panel
  scrollbar_mode: "OFF"
  widgets:
    - obj:
        id: ams_titlebar
        x: 0
        y: 0
        width: 800
        height: 45
        bg_opa: TRANSP
        border_width: 0
        scrollbar_mode: "OFF"
        widgets:
          - label:
              text: "AMS"
              x: 13
              y: 8
              width: 180
              height: 28
              text_font: roboto_20
              text_color: 0xFFFFFF
              align: TOP_LEFT
    - label:
        id: ams_empty
        width: 800
        text: "No AMS data"
        text_font: roboto_28
        text_color: 0x8888AA
        text_align: CENTER
        align: CENTER
    - label: {id: ams_hdr_l, x: 13, y: 0, width: 533, text: "", text_font: roboto_12, text_color: 0x7B9EFF, align: TOP_LEFT, hidden: true}
    - label: {id: ams_hdr_r, x: 13, y: 0, width: 533, text: "", text_font: roboto_12, text_color: 0x7B9EFF, align: TOP_LEFT, hidden: true}
    # Each AMS row: 60px tall, 62px stride.
    # Left side (x 0-143): AMS icon, name, temp/humidity, nozzle letter.
    # Right side (x 148+): 4 spool slots at x=148,231,314,397.
    #   Each slot: spool icon (32x32, y=3), type label (y=37), id label (y=48).
    - obj:
        id: ams_row0
        x: 0
        y: 0
        width: 790
        height: 105
        styles: sty_ams_row
        scrollbar_mode: "OFF"
        hidden: true
        widgets:
          - image: {id: ams0_icon, src: img_ams_sm, x: 10, y: 3, image_recolor: 0x7B9EFF, image_recolor_opa: COVER}
          - image: {id: ams0_hticon, src: img_ht_sm, x: 10, y: 3, image_recolor: 0xFF9E6E, image_recolor_opa: COVER, hidden: true}
          - image: {id: ams0_vticon, src: img_vt_sm, x: 10, y: 3, image_recolor: 0x7EC8A0, image_recolor_opa: COVER, hidden: true}
          - label: {id: ams0_name, x: 50, y: 6, width: 157, height: 45, text: "", text_font: roboto_12, text_color: 0x7B9EFF, long_mode: DOT, align: TOP_LEFT}
          - label: {x: 50, y: 38, width: 24, height: 24, text: "\\U000F0238", text_font: mdi_24, text_color: 0xFF9E6E, align: TOP_LEFT}
          - label: {id: ams0_temp, x: 76, y: 42, width: 46, height: 20, text: "", text_font: roboto_12, text_color: 0xDDDDEE, align: TOP_LEFT}
          - label: {x: 126, y: 38, width: 24, height: 24, text: "\\U000F058C", text_font: mdi_24, text_color: 0x5FAEFF, align: TOP_LEFT}
          - label: {id: ams0_hum, x: 152, y: 42, width: 48, height: 20, text: "", text_font: roboto_12, text_color: 0xDDDDEE, align: TOP_LEFT}
          - button:
              id: ams0_dry_btn
              x: 10
              y: 69
              width: 190
              height: 29
              styles: sty_accent_btn
              scrollbar_mode: "OFF"
              on_click:
                then:
                  - lambda: |-
                      intptr_t d = (intptr_t)lv_obj_get_user_data(id(ams0_dry_btn));
                      int ams_id = (int)(d & 0xFFFF);
                      bool currently_drying = ((unsigned)d & 0x10000u) != 0;
                      bambuddy->set_ams_drying(ams_id, !currently_drying);
              widgets:
                - label:
                    id: ams0_dry_lbl
                    text: "Dry PLA"
                    text_font: roboto_12
                    text_color: 0xFFB066
                    align: CENTER
          - label: {id: ams0_noz, x: 213, y: 6, width: 27, text: "", text_font: roboto_16, text_color: 0x4CAF50, align: TOP_LEFT}
          - image: {id: ams0_0_fill, src: img_spool_fill, x: 247, y: 9, image_recolor: 0x2A2A3A, image_recolor_opa: COVER}
          - obj: {id: ams0_0_hub, x: 263, y: 24, width: 20, height: 18, radius: 6, bg_color: 0x1B1B2A, bg_opa: COVER, border_width: 1, border_color: 0x555577, pad_all: 0, scrollbar_mode: "OFF"}
