              # ================ WAKE GUARD ====================================
              # Full-screen transparent overlay that sits on top of all other
              # widgets.  Shown by on_idle when the backlight dims; absorbs the
              # first touch that wakes the screen so underlying buttons aren't
              # accidentally triggered.  Hidden again by its own on_click, and
              # also by the weight-placement wake path in spoolbuddy_app.yaml.
              - obj:
                  id: wake_guard
                  x: 0
                  y: 0
                  width: 800
                  height: 480
                  bg_opa: TRANSP
                  border_width: 0
                  radius: 0
                  pad_all: 0
                  scrollbar_mode: "OFF"
                  hidden: true
                  on_click:
                    then:
                      - lambda: |-
                          lv_obj_add_flag(id(wake_guard), LV_OBJ_FLAG_HIDDEN);
                          // Waking from Dim (not deep sleep): restore user-configured brightness.
                          // Deep-sleep wake is handled by the interval lambda (is_sleeping path).
                          if (!id(is_sleeping)) {
                            id(display_backlight).turn_on()
                              .set_brightness(id(backlight_brightness_pct) / 100.0f)
                              .set_transition_length(150).perform();
                          }

  on_idle:
    timeout: 60s
    then:
      - light.turn_on:
          id: display_backlight
          brightness: 20%
          transition_length: 2s
      - lambda: "lv_obj_clear_flag(id(wake_guard), LV_OBJ_FLAG_HIDDEN);"
