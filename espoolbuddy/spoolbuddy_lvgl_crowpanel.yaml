# ============================================================================
# LVGL — native 800×480 SpoolPilot UI
#
#   Header     y=0    h=45   title + status message + wifi + api icons
#   Content    y=45   h=375  one of 5 stacked containers (AMS/NFC/Barcode/Scale/Cfg)
#   Bottom nav y=420  h=60   5 icon+label buttons
# ============================================================================
lvgl:
  displays:
    - main_display
  touchscreens:
    - touch_screen
  # Keep the LVGL draw buffer in fast internal RAM. ESPHome recommends 12%
  # when PSRAM is available; a 100% 800x480 buffer is forced into slower PSRAM
  # and can visibly tear when live weight updates redraw the screen.
  buffer_size: 12%
  color_depth: 16
  bg_color: 0x080A12
  default_font: roboto_16

  style_definitions:
    - id: sty_bar
      bg_color: 0x05070D
      bg_opa: COVER
      border_width: 0
      pad_all: 0
    - id: sty_panel
      bg_color: 0x080A12
      bg_opa: COVER
      border_width: 0
      pad_all: 0
    - id: sty_card
      bg_color: 0x10131D
      bg_opa: COVER
      border_width: 0
      radius: 6
      pad_all: 0
    - id: sty_ams_row
      bg_color: 0x10131D
      bg_opa: COVER
      border_width: 1
      border_color: 0x252A3A
      border_opa: COVER
      radius: 6
      pad_all: 0
    - id: sty_navbtn
      bg_color: 0x05070D
      bg_opa: COVER
      border_width: 0
      radius: 0
      pad_all: 0
    - id: sty_accent_btn
      bg_color: 0x1A2A50
      border_color: 0x4A7ACC
      border_width: 1
      text_color: 0x7BB4FF
      radius: 6

  pages:
    - id: main_page
      widgets:
        - obj:
            x: 0
            y: 0
            width: 800
            height: 480
            bg_color: 0x080A12
            border_width: 0
            pad_all: 0
            scrollbar_mode: "OFF"
            widgets:

              # ---------------- HEADER (y0 h30) ----------------
              # Title (left) + scrolling status message (middle) + wifi/api
              # status icons (right), all on one bar. Folding the status into
              # the header reclaims the old 24px status strip for the content.
              - obj:
                  x: 0
                  y: 0
                  width: 800
                  height: 45
                  styles: sty_bar
                  scrollbar_mode: "OFF"
                  widgets:
                    - label:
                        x: 13
                        y: 0
                        height: 45
                        # SpoolPilot brand title with the first word highlighted.
                        text: "#4ECDC4 Spool#Pilot"
                        text_font: roboto_20
                        text_color: 0xE0E0FF
                        recolor: true
                        align: LEFT_MID
                    # Clock + status share one slot centred between the title and
                    # the status icons. The UI interval lambda shows the status
                    # message (scrolling) when there is one, else the clock. Both
                    # have no fixed height so the LEFT_MID anchor centres them
                    # vertically (matching the icons).
                    - label:
                        id: lbl_status
                        x: 220
                        y: 0
                        width: 373
                        text: ""
                        text_font: roboto_12
                        text_color: 0xCCCCDD
                        long_mode: SCROLL_CIRCULAR
                        text_align: CENTER
                        align: LEFT_MID
                        hidden: true
                    - label:
                        id: lbl_clock
                        x: 220
                        y: 0
                        width: 373
                        text: "--:--"
                        text_font: roboto_16
                        text_color: 0xE0E0FF
                        text_align: CENTER
                        align: LEFT_MID
                    - label:
                        id: ic_wifi
                        x: 600
                        y: 0
                        width: 38
                        height: 45
                        text: "\U000F05AA"
                        text_font: mdi_24
                        text_color: 0x9A9CB5
                        align: LEFT_MID
                    - label:
                        id: ic_api
                        x: 638
                        y: 0
                        width: 38
                        height: 45
                        text: "\U000F0164"
                        text_font: mdi_24
                        text_color: 0x9A9CB5
                        align: LEFT_MID
                    - label:
                        id: ic_scale
                        x: 676
                        y: 0
                        width: 38
                        height: 45
                        text: "\U000F0472"
                        text_font: mdi_24
                        text_color: 0x9A9CB5
                        align: LEFT_MID
                    - label:
                        id: ic_printer
                        x: 714
                        y: 0
                        width: 38
                        height: 45
                        text: "\U000F042B"
                        text_font: mdi_24
                        text_color: 0x9A9CB5
                        align: LEFT_MID
                    - obj:
                        id: ic_db
                        x: 752
                        y: 0
                        width: 38
                        height: 45
                        bg_opa: TRANSP
                        border_width: 0
                        pad_all: 0
                        scrollbar_mode: "OFF"
                        widgets:
                          - image:
                              src: img_icon_spoolman
                              y: -13
                              image_recolor: 0x18E6DF
                              image_recolor_opa: COVER
                              align: CENTER

              # ================ CONTENT: SCALE ================
              - obj:
                  id: content_scale
                  x: 0
                  y: 45
                  width: 800
                  height: 375
                  styles: sty_panel
                  scrollbar_mode: "OFF"
                  hidden: true
                  widgets:
                    - obj:
                        id: scale_titlebar
                        x: 0
                        y: 0
                        width: 800
                        height: 46
                        bg_color: 0x05070D
                        bg_opa: COVER
                        border_width: 0
                        pad_all: 0
                        scrollbar_mode: "OFF"
                        widgets:
                          - button:
                              x: 12
                              y: 7
                              width: 92
                              height: 32
                              bg_color: 0x111827
                              border_color: 0x252A3A
                              border_width: 1
                              radius: 6
                              scrollbar_mode: "OFF"
                              on_click:
                                then:
                                  - script.execute: nav_back
                              widgets:
                                - label: {text: "Back", text_font: roboto_16, text_color: 0xFF6B6B, align: CENTER}
                          - button:
                              x: 114
                              y: 7
                              width: 92
                              height: 32
                              bg_color: 0x111827
                              border_color: 0x252A3A
                              border_width: 1
                              radius: 6
                              scrollbar_mode: "OFF"
                              on_click:
                                then:
                                  - script.execute: nav_home
                              widgets:
                                - label: {text: "Home", text_font: roboto_16, text_color: 0x18E6DF, align: CENTER}
                          - label: {x: 0, y: 0, width: 800, height: 46, text: "Scale", text_font: roboto_20, text_color: 0x18E6DF, text_align: CENTER, align: TOP_LEFT}
                    - label:
                        x: 0
                        y: 72
                        width: 800
                        text: "WEIGHT"
                        text_font: roboto_16
                        text_color: 0x18E6DF
                        text_align: CENTER
                        align: TOP_MID
                    - label:
                        id: lbl_weight
                        x: 0
                        y: 114
                        width: 800
                        text: ""
                        text_font: roboto_40
                        text_color: 0x18E6DF
                        text_align: CENTER
                        align: TOP_MID
                    - label:
                        id: lbl_weight_stable
                        x: 0
                        y: 201
                        width: 800
                        text: ""
                        text_font: roboto_16
                        text_color: 0x8888AA
                        text_align: CENTER
                        align: TOP_MID

                    # ---- Action buttons — bottom row, same layout as NFC tab ----
                    - button:
                        id: btn_tare
                        x: 13
                        y: 282
                        width: 380
                        height: 75
                        styles: sty_accent_btn
                        on_click:
                          then:
                            - lambda: bambuddy->request_tare();
                        widgets:
                          - label:
                              text: "TARE"
                              text_font: roboto_16
                              text_color: 0x7BB4FF
                              align: CENTER
                    - button:
                        id: btn_calibrate
                        x: 407
                        y: 282
                        width: 380
                        height: 75
                        styles: sty_accent_btn
                        on_click:
                          then:
                            - lambda: |-
                                char buf[10];
                                snprintf(buf, sizeof(buf), "%.0f g", id(cal_ref_weight));
                                lv_label_set_text(id(lbl_cal_weight), buf);
                                lv_obj_clear_flag(id(cal_modal), LV_OBJ_FLAG_HIDDEN);
                        widgets:
                          - label:
                              text: "CALIBRATE"
                              text_font: roboto_16
                              text_color: 0x7BB4FF
                              align: CENTER

              - !include lvgl/tab_nfc.yaml

              - !include lvgl/tab_barcode.yaml

              - !include lvgl/tab_ams.yaml

              # ================ CONTENT: SETTINGS (printer selection) ==========
              - obj:
                  id: content_cfg
                  x: 0
                  y: 45
                  width: 800
                  height: 375
                  styles: sty_panel
                  scrollbar_mode: "OFF"
                  hidden: true
                  widgets:
                    # ---- Fixed Back/Home title row ----
                    - obj:
                        id: cfg_titlebar
                        x: 0
                        y: 0
                        width: 800
                        height: 46
                        styles: sty_bar
                        scrollbar_mode: "OFF"
                        widgets:
                          - button:
                              x: 12
                              y: 7
                              width: 92
                              height: 32
                              bg_color: 0x111827
                              border_color: 0x252A3A
                              border_width: 1
                              radius: 6
                              scrollbar_mode: "OFF"
                              on_click:
                                then:
                                  - script.execute: nav_back
                              widgets:
                                - label: {text: "Back", text_font: roboto_16, text_color: 0xFF6B6B, align: CENTER}
                          - button:
                              x: 114
                              y: 7
                              width: 92
                              height: 32
                              bg_color: 0x111827
                              border_color: 0x252A3A
                              border_width: 1
                              radius: 6
                              scrollbar_mode: "OFF"
                              on_click:
                                then:
                                  - script.execute: nav_home
                              widgets:
                                - label: {text: "Home", text_font: roboto_16, text_color: 0x18E6DF, align: CENTER}
                          - label:
                              x: 0
                              width: 800
                              text: "Settings"
                              text_font: roboto_20
                              text_color: 0x18E6DF
                              text_align: CENTER
                              align: CENTER
                    # Thin separator below the header
                    - obj:
                        x: 0
                        y: 46
                        width: 800
                        height: 2
                        bg_color: 0x454572
                        bg_opa: COVER
                        border_width: 0
                        radius: 0
                        scrollbar_mode: "OFF"

                    # ==== Settings rows (top-aligned): Printer | NFC in sleep | Sound ====
                    # ---- Row: selected printer (tap the value to open the picker popup) ----
                    - obj:
                        x: 0
                        y: 54
                        width: 800
                        height: 57
                        bg_opa: TRANSP
                        border_width: 0
                        pad_all: 0
                        scrollbar_mode: "OFF"
                        widgets:
                          - label:
                              x: 23
                              width: 183
                              text: "Printer"
                              text_font: roboto_16
                              text_color: 0xAAAAAA
                              align: LEFT_MID
                          - button:
                              id: btn_printer_pick
                              x: 250
                              y: 5
                              width: 533
                              height: 48
                              styles: sty_card
                              scrollbar_mode: "OFF"
                              on_click:
                                then:
                                  - lambda: 'lv_obj_clear_flag(id(printer_modal), LV_OBJ_FLAG_HIDDEN);'
                              widgets:
                                - label: {id: lbl_printer_sel_icon, x: 13, width: 40, text: "\U000F0765", text_font: mdi_24, text_color: 0x666688, align: LEFT_MID}
                                - label: {id: lbl_printer_sel, x: 63, width: 380, text: "—", text_font: roboto_16, text_color: 0xDDDDEE, long_mode: DOT, align: LEFT_MID}
                                - label: {x: 493, width: 40, text: "\U000F0142", text_font: mdi_24, text_color: 0x18E6DF, align: LEFT_MID}

                    # ---- Row: Sound on/off (Off | On segments) ----
                    - obj:
                        x: 0
                        y: 117
                        width: 800
                        height: 57
                        bg_opa: TRANSP
                        border_width: 0
                        pad_all: 0
                        scrollbar_mode: "OFF"
                        widgets:
                          - label:
                              x: 23
                              width: 217
                              text: "Sound"
                              text_font: roboto_16
                              text_color: 0xAAAAAA
                              align: LEFT_MID
                          - button:
                              id: btn_sound_off
                              x: 250
                              y: 5
                              width: 263
                              height: 48
                              styles: sty_card
                              scrollbar_mode: "OFF"
                              on_click:
                                then:
                                  - lambda: 'id(sound_enabled) = 0;'
                                  - script.execute: update_sound_btn
                              widgets:
                                - label: {id: lbl_sound_off, text: "Off", text_font: roboto_16, text_color: 0x8888AA, align: CENTER}
                          - button:
                              id: btn_sound_on
                              x: 520
                              y: 5
                              width: 263
                              height: 48
                              styles: sty_card
                              scrollbar_mode: "OFF"
                              on_click:
                                then:
                                  - lambda: 'id(sound_enabled) = 1;'
                                  - script.execute: update_sound_btn
                              widgets:
                                - label: {id: lbl_sound_on, text: "On", text_font: roboto_16, text_color: 0x8888AA, align: CENTER}

                    # ---- Row: Backlight brightness (slider 25–100%, 5% steps) ----
                    - obj:
                        x: 0
                        y: 180
                        width: 800
                        height: 57
                        bg_opa: TRANSP
                        border_width: 0
                        pad_all: 0
                        scrollbar_mode: "OFF"
                        widgets:
                          - label:
                              x: 23
                              width: 217
                              text: "Brightness"
                              text_font: roboto_16
                              text_color: 0xAAAAAA
                              align: LEFT_MID
                          - slider:
                              id: sl_brightness
                              x: 247
                              y: 17
                              width: 457
                              height: 24
                              min_value: 25
                              max_value: 100
                              value: 100
                              on_value:
                                then:
                                  - lambda: |-
                                      // Snap to 5% steps and store. Inline to avoid circular
                                      // trigger: update_backlight_brightness → lv_slider_set_value
                                      // → on_value → update_backlight_brightness → ...
                                      int snapped = ((x + 2) / 5) * 5;
                                      if (snapped < 25) snapped = 25;
                                      if (snapped > 100) snapped = 100;
                                      id(backlight_brightness_pct) = snapped;
                                      id(display_backlight).turn_on()
                                        .set_brightness(snapped / 100.0f)
                                        .set_transition_length(50).perform();
                                      char buf[6];
                                      snprintf(buf, sizeof(buf), "%d%%", snapped);
                                      lv_label_set_text(id(lbl_brightness_val), buf);
                          - label:
                              id: lbl_brightness_val
                              x: 717
                              width: 77
                              text: "100%"
                              text_font: roboto_16
                              text_color: 0xDDDDEE
                              text_align: RIGHT
                              align: LEFT_MID

                    # ---- Row: Sleep settings (opens sleep subpage) ----
                    - obj:
                        x: 0
                        y: 243
                        width: 800
                        height: 57
                        bg_opa: TRANSP
                        border_width: 0
                        pad_all: 0
                        scrollbar_mode: "OFF"
                        widgets:
                          - label:
                              x: 23
                              width: 183
                              text: "Sleep"
                              text_font: roboto_16
                              text_color: 0xAAAAAA
                              align: LEFT_MID
                          - button:
                              id: btn_sleep_page
                              x: 250
                              y: 5
                              width: 533
                              height: 48
                              styles: sty_card
                              scrollbar_mode: "OFF"
                              on_click:
                                then:
                                  - lambda: 'lv_obj_clear_flag(id(content_sleep), LV_OBJ_FLAG_HIDDEN);'
                              widgets:
                                - label: {x: 13, width: 467, text: "Sleep settings", text_font: roboto_16, text_color: 0xDDDDEE, align: LEFT_MID}
                                - label: {x: 493, width: 40, text: "\U000F0142", text_font: mdi_24, text_color: 0x18E6DF, align: LEFT_MID}

                    # ---- Row: Update / SpoolmanDB ----
                    - obj:
                        x: 0
                        y: 306
                        width: 800
                        height: 57
                        bg_opa: TRANSP
                        border_width: 0
                        pad_all: 0
                        scrollbar_mode: "OFF"
                        widgets:
                          - label:
                              x: 23
                              width: 183
                              text: "Update"
                              text_font: roboto_16
                              text_color: 0x9A9CB5
                              align: LEFT_MID
                          - button:
                              x: 250
                              y: 5
                              width: 345
                              height: 48
                              styles: sty_card
                              on_click:
                                then:
                                  - lambda: 'lv_obj_clear_flag(id(content_update), LV_OBJ_FLAG_HIDDEN);'
                              widgets:
                                - label: {x: 12, width: 300, text: "SpoolmanDB  ·  DB○", text_font: roboto_16, text_color: 0xF3F5FA, align: LEFT_MID}
                          - button:
                              x: 607
                              y: 5
                              width: 176
                              height: 48
                              bg_color: 0x10131D
                              border_color: 0x18E6DF
                              border_width: 1
                              radius: 6
                              on_click:
                                then:
                                  - script.execute: db_update_demo
                              widgets:
                                - label: {text: "Update Now", text_font: roboto_12, text_color: 0x18E6DF, align: CENTER}

                    # ---- App version (bottom-right; text set in apply_tab from
                    #      esphome.project.version via ESPHOME_PROJECT_VERSION) ----
                    - label:
                        id: lbl_version
                        text: ""
                        text_font: roboto_12
                        text_color: 0x9A9CB5
                        x: 710
                        y: 15
                        width: 80
                        text_align: RIGHT
                        align: TOP_LEFT

                    # ---- Update / SpoolmanDB subpage ----
                    - obj:
                        id: content_update
                        x: 0
                        y: 0
                        width: 800
                        height: 375
                        bg_color: 0x080A12
                        bg_opa: COVER
                        border_width: 0
                        radius: 0
                        pad_all: 0
                        scrollbar_mode: "OFF"
                        hidden: true
                        widgets:
                          - obj:
                              x: 0
                              y: 0
                              width: 800
                              height: 46
                              bg_color: 0x05070D
                              bg_opa: COVER
                              border_width: 0
                              widgets:
                                - button:
                                    x: 12
                                    y: 7
                                    width: 92
                                    height: 32
                                    bg_color: 0x111827
                                    border_color: 0x252A3A
                                    border_width: 1
                                    radius: 6
                                    scrollbar_mode: "OFF"
                                    on_click:
                                      then:
                                        - script.execute: nav_back
                                    widgets:
                                      - label: {text: "Back", text_font: roboto_16, text_color: 0xFF6B6B, align: CENTER}
                                - button:
                                    x: 114
                                    y: 7
                                    width: 92
                                    height: 32
                                    bg_color: 0x111827
                                    border_color: 0x252A3A
                                    border_width: 1
                                    radius: 6
                                    scrollbar_mode: "OFF"
                                    on_click:
                                      then:
                                        - script.execute: nav_home
                                    widgets:
                                      - label: {text: "Home", text_font: roboto_16, text_color: 0x18E6DF, align: CENTER}
                                - label: {x: 0, width: 800, text: "Update", text_font: roboto_20, text_color: 0x18E6DF, text_align: CENTER, align: CENTER}
                          - label: {x: 30, y: 72, width: 250, text: "SpoolmanDB", text_font: roboto_20, text_color: 0xF3F5FA, align: TOP_LEFT}
                          - label: {x: 30, y: 111, width: 310, text: "Catalog status: DB○", text_font: roboto_16, text_color: 0x9A9CB5, align: TOP_LEFT}
                          - button:
                              x: 510
                              y: 72
                              width: 250
                              height: 60
                              bg_color: 0x10131D
                              border_color: 0x18E6DF
                              border_width: 1
                              radius: 7
                              on_click:
                                then:
                                  - script.execute: db_update_demo
                              widgets:
                                - label: {text: "Update Now", text_font: roboto_16, text_color: 0x18E6DF, align: CENTER}
                          - label: {x: 30, y: 168, width: 200, text: "Auto Update", text_font: roboto_16, text_color: 0x9A9CB5, align: TOP_LEFT}
                          - button:
                              x: 250
                              y: 153
                              width: 210
                              height: 52
                              bg_color: 0x10131D
                              border_color: 0x252A3A
                              border_width: 1
                              radius: 6
                              on_click:
                                then:
                                  - lambda: 'id(db_auto_update)=!id(db_auto_update);'
                              widgets:
                                - label: {text: "Enabled", text_font: roboto_16, text_color: 0x55D66B, align: CENTER}
                          - obj:
                              x: 30
                              y: 226
                              width: 730
                              height: 72
                              bg_color: 0x10131D
                              border_color: 0x252A3A
                              border_width: 1
                              radius: 7
                              widgets:
                                - label:
                                    id: lbl_db_update_status
                                    x: 14
                                    y: 10
                                    width: 700
                                    height: 48
                                    text: "DB backend wiring is the next stage"
                                    text_font: roboto_12
                                    text_color: 0x9A9CB5
                                    long_mode: WRAP
                                    align: TOP_LEFT
                          - button:
                              id: btn_reboot
                              x: 590
                              y: 310
                              width: 170
                              height: 48
                              bg_color: 0x3A1414
                              border_width: 0
                              radius: 6
                              on_click:
                                then:
                                  - lambda: |-
                                      id(confirm_action) = 3;
                                      lv_label_set_text(id(confirm_msg), "Reboot the console now?");
                                      lv_label_set_text(id(confirm_ok_lbl), "Reboot");
                                      lv_obj_clear_flag(id(confirm_modal), LV_OBJ_FLAG_HIDDEN);
                              widgets:
                                - label: {text: "Reboot", text_font: roboto_16, text_color: 0xFF6B6B, align: CENTER}

                    # ---- Sleep settings subpage (overlays full content_cfg area) ----
                    - obj:
                        id: content_sleep
                        x: 0
                        y: 0
                        width: 800
                        height: 375
                        bg_color: 0x080A12
                        bg_opa: COVER
                        border_width: 0
                        radius: 0
                        pad_all: 0
                        scrollbar_mode: "OFF"
                        hidden: true
                        widgets:
                          # Header with back button
                          - obj:
                              x: 0
                              y: 0
                              width: 800
                              height: 46
                              styles: sty_bar
                              scrollbar_mode: "OFF"
                              widgets:
                                - button:
                                    x: 12
                                    y: 7
                                    width: 92
                                    height: 32
                                    bg_color: 0x111827
                                    border_color: 0x252A3A
                                    border_width: 1
                                    radius: 6
                                    scrollbar_mode: "OFF"
                                    on_click:
                                      then:
                                        - script.execute: nav_back
                                    widgets:
                                      - label: {text: "Back", text_font: roboto_16, text_color: 0xFF6B6B, align: CENTER}
                                - button:
                                    x: 114
                                    y: 7
                                    width: 92
                                    height: 32
                                    bg_color: 0x111827
                                    border_color: 0x252A3A
                                    border_width: 1
                                    radius: 6
                                    scrollbar_mode: "OFF"
                                    on_click:
                                      then:
                                        - script.execute: nav_home
                                    widgets:
                                      - label: {text: "Home", text_font: roboto_16, text_color: 0x18E6DF, align: CENTER}
                                - label:
                                    x: 0
                                    width: 800
                                    text: "Sleep Settings"
                                    text_font: roboto_20
                                    text_color: 0x18E6DF
                                    text_align: CENTER
                                    align: CENTER
                          # Separator
                          - obj:
                              x: 0
                              y: 46
                              width: 800
                              height: 2
                              bg_color: 0x454572
                              bg_opa: COVER
                              border_width: 0
                              radius: 0
                              scrollbar_mode: "OFF"

                          # ---- Row: Inactivity timeout (-/value/+) ----
                          - obj:
                              x: 0
                              y: 54
                              width: 800
                              height: 57
                              bg_opa: TRANSP
