                  shadow_offset_x: 0
                  shadow_offset_y: 6
                  shadow_spread: 2
                  shadow_color: 0x000000
                  shadow_opa: COVER
                  hidden: true
                  widgets:
                    # ---- Spool icon (80×80) — left column ----
                    - obj:
                        x: 20
                        y: 18
                        width: 133
                        height: 120
                        bg_opa: TRANSP
                        border_width: 0
                        pad_all: 0
                        scrollbar_mode: "OFF"
                        widgets:
